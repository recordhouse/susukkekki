<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="수수께끼의 미스터리, 유머, 여행, 과학 최신 이야기를 카테고리별로 모아 빠르게 탐색할 수 있는 흥미로운 이야기 모음입니다."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="수수께끼" />
    <meta property="og:title" content="흥미로운 이야기 | 수수께끼 최신 글 모음" />
    <meta
      property="og:description"
      content="미스터리, 유머, 여행, 과학 카테고리의 최신 글을 한곳에서 탐색하세요."
    />
    <meta property="og:url" content="https://susukkekki.kr/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="흥미로운 이야기 | 수수께끼 최신 글 모음" />
    <meta
      name="twitter:description"
      content="수수께끼의 최신 흥미로운 이야기를 카테고리별로 모아 보여줍니다."
    />
    <link rel="canonical" href="https://susukkekki.kr/" />
    <link rel="preconnect" href="https://susukkekki.kr" />
    <title>흥미로운 이야기 | 수수께끼 최신 글 모음</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "수수께끼",
        "alternateName": "흥미로운 이야기",
        "url": "https://susukkekki.kr/",
        "description": "미스터리, 유머, 여행, 과학 등 흥미로운 이야기를 제공하는 한국어 콘텐츠 사이트입니다.",
        "inLanguage": "ko-KR"
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="사이트 헤더">
        <div>
          <p class="eyebrow">susukkekki.kr</p>
          <h1>흥미로운 이야기</h1>
          <p class="lede">
            미스터리, 유머, 여행, 과학 분야의 최신 글을 카테고리별로 정리했습니다.
          </p>
        </div>
        <div class="actions">
          <label class="search">
            <span class="sr-only">게시글 검색</span>
            <input id="searchInput" type="search" placeholder="제목이나 요약 검색" />
          </label>
          <button id="refreshButton" type="button" aria-label="최신 글 새로고침">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <section class="status-row" aria-live="polite">
        <p id="statusText">카테고리별 최신 게시글을 불러오는 중입니다.</p>
        <a href="https://susukkekki.kr/" target="_blank" rel="noreferrer">원본 사이트</a>
      </section>

      <section id="featuredPost" class="featured" aria-label="가장 최근 게시글"></section>
      <section id="postGrid" class="category-list" aria-label="카테고리별 최신 게시글 목록"></section>
      <noscript>
        <section class="fallback-links" aria-label="수수께끼 주요 카테고리">
          <h2>수수께끼 주요 카테고리</h2>
          <p>자바스크립트가 꺼져 있어 최신 글 목록을 표시할 수 없습니다.</p>
          <ul>
            <li><a href="https://susukkekki.kr/category/mystery/">미스터리</a></li>
            <li><a href="https://susukkekki.kr/category/humor/">유머</a></li>
            <li><a href="https://susukkekki.kr/category/travel/">여행</a></li>
            <li><a href="https://susukkekki.kr/category/science/">과학</a></li>
          </ul>
        </section>
      </noscript>
    </main>

    <template id="postCardTemplate">
      <article class="post-card">
        <a class="thumb-link" target="_blank" rel="noreferrer">
          <img class="thumb" alt="" loading="lazy" />
          <span class="thumb-fallback" aria-hidden="true"></span>
        </a>
        <div class="post-body">
          <time></time>
          <h3><a target="_blank" rel="noreferrer"></a></h3>
          <p></p>
        </div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
